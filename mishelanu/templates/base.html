<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}משלנו{% endblock %}</title>
  <meta name="description" content="אינדקס בעלי מקצוע ועסקים בשדה ורבורג">
  <meta name="theme-color" content="#0d9488">
  <meta name="application-name" content="משלנו">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="משלנו">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
  <script src="{{ url_for('static', filename='js/pwa.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/site-sidebar.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}" data-sw="{{ url_for('sw') }}">
  <div class="site-shell">
    <aside class="site-sidebar" aria-label="ניווט ראשי">
      <div class="site-sidebar-panel" id="site-sidebar-panel">
        <a class="site-sidebar-section-title site-sidebar-section-link{% if request.endpoint == 'index' %} is-current{% endif %}"
           href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>
          <span class="section-emoji" aria-hidden="true">⭐</span><span class="section-label">משלנו</span>
        </a>

        <nav class="site-sidebar-nav site-sidebar-nav-main" aria-label="משלנו">
          <a href="{{ url_for('add') }}"{% if request.endpoint == 'add' %} class="is-current" aria-current="page"{% endif %}>
            <span class="nav-emoji" aria-hidden="true">✍️</span><span class="nav-label">הצטרפות לאינדקס</span>
          </a>
          <a href="{{ url_for('map_page') }}"{% if request.endpoint == 'map_page' %} class="is-current" aria-current="page"{% endif %}>
            <span class="nav-emoji" aria-hidden="true">🗺️</span><span class="nav-label">מפה</span>
          </a>
        </nav>

        <div class="site-sidebar-footer">
          <div class="sidebar-auth">
            {% if is_admin %}
            <div class="logged-row">
              <span class="muted">מחובר/ת</span>
              <a class="btn" href="{{ url_for('logout') }}">התנתק</a>
            </div>
            {% elif admin_ready and request.endpoint != 'login' %}
            <div class="login-wrap">
              <a class="btn" href="{{ url_for('login') }}">כניסה</a>
            </div>
            {% endif %}
          </div>
          <p class="site-sidebar-credit">© 2026 קרן סלע</p>
        </div>
      </div>
    </aside>

    <main class="site-main">
      <div class="menu-row">
        <button type="button" class="site-sidebar-menu-toggle" id="site-sidebar-menu-btn"
                aria-expanded="false" aria-controls="site-sidebar-panel" aria-label="פתח תפריט ניווט">
          <span class="site-sidebar-menu-toggle-emoji" aria-hidden="true">☰</span>
          <span class="site-sidebar-menu-toggle-text">תפריט</span>
        </button>
      </div>
      <div class="page">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
{% block scripts %}{% endblock %}
</html>
